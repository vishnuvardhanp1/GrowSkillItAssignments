<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Form Page</title>
</head>
<body>

  <h2>Simple HTML Form</h2>

  <!-- Two textareas with same id -->
  <textarea id="message" rows="4" cols="30" placeholder="Enter text here"></textarea>

  <br><br>

  <textarea id="message" rows="4" cols="30" placeholder="Enter more text here"></textarea>

  <br><br>

  <!-- Dropdown -->
  <label for="color">Choose Color:</label>
  <select id="color" name="color">
    <option value="1">Red</option>
    <option value="1">Blue</option>
    <option value="1">Green</option>
  </select>

  <br><br>

  <!-- Checkbox with name attribute -->
  <label>
    <input type="checkbox" name="agreement" />
    Do you agree?
  </label>

</body>
</html>
